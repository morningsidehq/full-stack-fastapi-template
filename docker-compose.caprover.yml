version: '3.8'

services:
  backend:
    image: ${DOCKER_IMAGE_BACKEND:-backend}:${TAG:-latest}
    restart: always
    networks:
      - traefik-public
      - default
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=srv-captain--crud-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=f26131844cfb8be6
      - POSTGRES_DB=postgres
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-changethis}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-changethis}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.${STACK_NAME:-backend}.loadbalancer.server.port=8000
      - traefik.http.routers.${STACK_NAME:-backend}-https.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME:-backend}-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME:-backend}-https.tls=true
      - traefik.http.routers.${STACK_NAME:-backend}-https.tls.certresolver=le

  frontend:
    image: ${DOCKER_IMAGE_FRONTEND:-frontend}:${TAG:-latest}
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: ./frontend
      args:
        - VITE_API_URL=https://api.${DOMAIN}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.${STACK_NAME:-frontend}.loadbalancer.server.port=80
      - traefik.http.routers.${STACK_NAME:-frontend}-https.rule=Host(`dashboard.${DOMAIN}`)
      - traefik.http.routers.${STACK_NAME:-frontend}-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME:-frontend}-https.tls=true
      - traefik.http.routers.${STACK_NAME:-frontend}-https.tls.certresolver=le

networks:
  traefik-public:
    external: true
  default:
    driver: bridge 